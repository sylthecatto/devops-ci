name: Test Staging & Auto-Release to Production

on:
  push:
    branches:
      - staging

jobs:
  # ========================================
  # STAGE 1: Test on Every Push to Staging
  # ========================================
  test-staging:
    name: Test Staging Branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect-release.outputs.version }}
      should-release: ${{ steps.detect-release.outputs.should-release }}

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check for release marker
        id: detect-release
        run: |
          LAST_MSG=$(git log -1 --pretty=%B)

          if [[ $LAST_MSG =~ \[release:\ v([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            VERSION="v${BASH_REMATCH[1]}"
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "✅ Tests passed. Release marker found: $VERSION"
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "✅ Tests passed. Staging-only update (no release marker)"
          fi

  # ========================================
  # STAGE 2: Create Tag If Release Detected
  # ========================================
  create-release-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: test-staging
    if: needs.test-staging.outputs.should-release == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          VERSION: ${{ needs.test-staging.outputs.version }}
        run: |
          git tag -a $VERSION -m "Release $VERSION"
          git push origin $VERSION
          echo "✅ Tag $VERSION created and pushed"

  # ========================================
  # STAGE 3: Merge to Production After Tag
  # ========================================
  merge-to-production:
    name: Merge Staging → Production
    runs-on: ubuntu-latest
    needs: [test-staging, create-release-tag]
    if: needs.test-staging.outputs.should-release == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge staging into production
        env:
          VERSION: ${{ needs.test-staging.outputs.version }}
        run: |
          git fetch origin
          git checkout production
          git merge --no-ff origin/staging -m "chore: merge staging into production for $VERSION"
          git push origin production
          echo "✅ Merged staging → production"
          echo "Jenkins webhook will detect tag and build production image"
